<div class="card">
    <p-toast></p-toast>
    <p-toolbar styleClass="mb-4 gap-2">
        <ng-template pTemplate="left">
            <p-button pRipple severity="success" label="Novo" icon="pi pi-plus" class="mr-2" (click)="openNew()" />
        </ng-template>
          <ng-template #end>
                <p-button label="Gerar qrcode" icon="pi pi-upload" severity="secondary" (click)="generateQrcode()" />
            </ng-template>
    </p-toolbar>

    <p-table #dt 
    [value]="mesas()" 
    [rows]="10" 
    [paginator]="false" 
    [(selection)]="selectedMesas"
    [globalFilterFields]="['numero', 'capacidade']"
    [tableStyle]="{ 'min-width': '75rem' }" 
    [rowHover]="true" 
    dataKey="id"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} entradas"
        [showCurrentPageReport]="true">
        <ng-template pTemplate="header">
            <tr>
                 <th style="width: 3rem">
                        <p-tableHeaderCheckbox />
                </th>
                <th pSortableColumn="numero" style="min-width:10rem">
                    Número <p-sortIcon field="numero"></p-sortIcon>
                </th>
                <th pSortableColumn="garcom" style="min-width:10rem">
                    Garcom <p-sortIcon field="garcom"></p-sortIcon>
                </th>
                <th style="min-width:10rem">Ações</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-mesa>
            <tr>
                 <td style="width: 3rem">
                        <p-tableCheckbox [value]="mesa" />
                    </td>
                <td>Mesa: &nbsp;{{ mesa.numero }}</td>
                <td>{{ mesa.garcom }}</td>
                <td>
                    <p-button pRipple icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"
                        severity="success" (click)="editMesa(mesa)" />
                    <p-button pRipple icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                        (click)="deleteMesa(mesa)" />
                </td>
            </tr>
        </ng-template>
    </p-table>

    <p-paginator (onPageChange)="onPageChange($event)" [first]="first" [rows]="rows" [totalRecords]="totalRecords" />

    <p-dialog [(visible)]="mesaDialog" [style]="{ width: '450px' }" [header]="tituloDialog" [modal]="true">
        <ng-template #content>
            <form [formGroup]="form">
                <div class="flex flex-col gap-6">
                    <div>
                        <label for="numero" class="block font-bold mb-3">Número</label>
                        <input maxlength="3" pInputText type="number" id="numero" formControlName="numero" required
                            autofocus fluid placeholder="Digite o número" />
                        <small class="text-red-500"
                            *ngIf=" (form.get('numero')?.dirty || form.get('numero')?.touched)">Número
                            é requerido.</small>
                    </div>
                    <div>
                        <label for="description" class="block font-bold mb-3">Garcom</label>
                        <p-select id="state" formControlName="garcom" [options]="dropdownItems"
                            optionLabel="name" placeholder="Selecione um garçom" styleClass="w-full" appendTo="body" />
                        <small class="text-red-500"
                            *ngIf="form.get('garcom')?.hasError('required') && (form.get('garcom')?.dirty || form.get('garcom')?.touched)">Garcom
                            é requerido.</small>
                        <small class="text-red-500"
                            *ngIf="form.get('numero')?.hasError('invalidNumero') && (form.get('numero')?.dirty || form.get('numero')?.touched)">Número
                            inválido.</small>
                    </div>
                </div>
            </form>
        </ng-template>

        <ng-template #footer>
            <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />
            @if (salvar) {
            <p-button label="Save" icon="pi pi-check" (click)="saveMesa()" [disabled]="form.invalid" />
            }
            @if (!salvar) {
            <p-button label="Editar" icon="pi pi-check" (click)="updateMesa()" />
            }
        </ng-template>
    </p-dialog>
    <p-confirmDialog [style]="{ width: '450px' }" />
</div>
